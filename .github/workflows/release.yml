# Runs when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# 1. Creates a GitHub Release with the .vsix attached (notes from CHANGELOG.md).
#    Upload that file at https://marketplace.visualstudio.com/manage (⋯ > Update)
#    to publish on the VS Code Marketplace by hand.
# 2. Publishes to Open VSX when the OVSX_PAT secret is set (open-vsx.org token).
# 3. Publishes to the VS Code Marketplace when the VSCE_PAT secret is set
#    (Azure DevOps token with Marketplace > Manage). Skipped otherwise.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, without its heading
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix
