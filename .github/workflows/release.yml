# Runs when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# 1. Creates a GitHub Release with the .vsix attached (notes from CHANGELOG.md).
#    Upload that file at https://marketplace.visualstudio.com/manage (⋯ > Update)
#    to publish on the VS Code Marketplace by hand.
# 2. Publishes to Open VSX with trusted publishing (OIDC), so no token is stored.
#    This repo and workflow file are registered under the bourhaouta namespace's
#    Trusted Publishers at https://open-vsx.org/user-settings/namespaces
# 3. Publishes to the VS Code Marketplace when the VSCE_PAT secret is set
#    (Azure DevOps token with Marketplace > Manage). Skipped otherwise.
# 4. Publishes the npm packages tailwindshades-cli and tailwindshades-mcp with
#    trusted publishing (OIDC, with provenance). Each package lists this repo
#    and release.yml as its trusted publisher on npmjs.com (package Settings).
#    A version that is already on npm is skipped, so the step can be re-run.
# 5. Publishes packages/mcp/server.json to the MCP Registry, logged in with
#    GitHub OIDC (io.github.bourhaouta/* names need no other secret).
#
# The extension and both packages share one version (a test checks it).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # OIDC tokens for Open VSX, npm and the MCP Registry
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, without its heading
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix --trusted-publishing

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix

      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10
      - run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: |
          for pkg in packages/core packages/mcp; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            else
              npm publish -w "$pkg"
            fi
          done

      - name: Publish to the MCP Registry
        working-directory: packages/mcp
        run: |
          # The Registry checks the npm package, and npm takes a few minutes
          # to serve a new version, so wait for it (up to 15 minutes)
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            npm view "tailwindshades-mcp@$version" version > /dev/null 2>&1 && break
            echo "Waiting for tailwindshades-mcp@$version on npm ($attempt/30)"
            sleep 30
          done
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
